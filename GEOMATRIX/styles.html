<style>
/* =========================================================================
   GEOMATRIX - MODERN NEO-BRUTALIST STEM DESIGN SYSTEM
   Brand Palette:
     --yellow:   #ffe17c (Primary)
     --charcoal: #171e19 (Background Dark / Text Primary)
     --sage:     #b7c6c2 (Accent)
     --white:    #ffffff
     --black:    #000000
     --gray-light: #f4f4f5
     --gray-dark:  #272727
   Rules:
     - 2px solid #000000 borders on all interactive components
     - Hard shadows (4px, 6px, 8px, 12px) with zero blur
     - No soft shadows, no gradients as background colors, no glassmorphism
     - Typography: Cabinet Grotesk (800) for Headings, Satoshi for Body
   ========================================================================= */

:root {
  --yellow: #ffe17c;
  --charcoal: #171e19;
  --sage: #b7c6c2;
  --white: #ffffff;
  --black: #000000;
  --gray-light: #f4f4f5;
  --gray-dark: #272727;

  --gm-yellow: #ffe17c;
  --gm-charcoal: #171e19;
  --gm-sage: #b7c6c2;
  --gm-white: #ffffff;
  --gm-black: #000000;

  --gm-border: 2px solid #000000;
  --gm-border-thick: 3px solid #000000;
  --gm-border-hero: 4px solid #000000;

  --gm-shadow-sm: 4px 4px 0px 0px #000000;
  --gm-shadow-md: 6px 6px 0px 0px #000000;
  --gm-shadow-lg: 8px 8px 0px 0px #000000;
  --gm-shadow-hero: 12px 12px 0px 0px #000000;

  --gm-radius-button: 10px;
  --gm-radius-card: 16px;
  --gm-radius-pill: 9999px;
  --gm-radius-lg: 20px;

  --font-heading: 'Cabinet Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-body: 'Satoshi', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', Consolas, monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
}

body {
  font-family: var(--font-body);
  background-color: var(--gray-light);
  color: var(--black);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

h1, .font-heading-h1 {
  font-family: var(--font-heading);
  font-weight: 800;
  letter-spacing: -0.025em;
  color: var(--black);
  font-size: clamp(38px, 4vw, 56px);
  line-height: 1.15;
}

h2, .font-heading-h2 {
  font-family: var(--font-heading);
  font-weight: 750;
  letter-spacing: -0.02em;
  color: var(--black);
  font-size: clamp(28px, 2.5vw, 40px);
  line-height: 1.25;
}

h3, .font-heading-h3 {
  font-family: var(--font-heading);
  font-weight: 700;
  color: var(--black);
  font-size: clamp(22px, 1.8vw, 26px);
  line-height: 1.3;
}

h4, .font-heading-h4 {
  font-family: var(--font-heading);
  font-weight: 700;
  color: var(--black);
  font-size: clamp(19px, 1.4vw, 21px);
  line-height: 1.35;
}

/* Background Pattern on Yellow surfaces */
.bg-yellow-pattern {
  background-color: var(--yellow);
  background-image: radial-gradient(rgba(0, 0, 0, 0.12) 1.5px, transparent 1.5px);
  background-size: 32px 32px;
}

/* Main Container */
.app-container {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 32px;
}

@media (max-width: 768px) {
  .app-container {
    padding: 0 16px;
  }
}

/* =========================================================================
   1. TOP NAVIGATION (Neo-Brutalist Sticky Bar)
   ========================================================================= */
.neo-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  height: 76px;
  background-color: var(--yellow);
  border-bottom: 2px solid var(--black);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
}

@media (max-width: 768px) {
  .neo-nav {
    height: 68px;
    padding: 0 16px;
  }
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  cursor: pointer;
}

.nav-logo-box {
  width: 44px;
  height: 44px;
  background-color: var(--charcoal);
  border: 2px solid var(--black);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--yellow);
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 22px;
  box-shadow: 3px 3px 0px var(--black);
}

.nav-brand-text {
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 20px;
  color: var(--black);
  letter-spacing: -0.02em;
}

.nav-center-links {
  display: flex;
  align-items: center;
  gap: 6px;
}

@media (max-width: 992px) {
  .nav-center-links {
    display: none;
  }
}

.nav-link-btn {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 14px;
  color: var(--charcoal);
  background: transparent;
  border: 2px solid transparent;
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

.nav-link-btn:hover {
  background-color: var(--white);
  border: 2px solid var(--black);
  box-shadow: 2px 2px 0px var(--black);
  transform: translate(-1px, -1px);
}

.nav-link-btn.active {
  background-color: var(--white);
  border: 2px solid var(--black);
  color: var(--black);
  font-weight: 700;
  box-shadow: 3px 3px 0px var(--black);
}

.nav-right-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-cta-btn {
  background-color: var(--charcoal);
  color: var(--white);
  border: 2px solid var(--black);
  border-radius: 10px;
  padding: 10px 20px;
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.02em;
  box-shadow: 4px 4px 0px var(--black);
  cursor: pointer;
  transition: transform 0.16s ease, box-shadow 0.16s ease;
}

.nav-cta-btn:hover {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0px var(--black);
}

.nav-cta-btn:active {
  transform: translate(4px, 4px);
  box-shadow: none;
}

.mobile-menu-toggle {
  display: none;
  width: 44px;
  height: 44px;
  background-color: var(--white);
  border: 2px solid var(--black);
  border-radius: 10px;
  box-shadow: 3px 3px 0px var(--black);
  cursor: pointer;
  font-size: 20px;
  align-items: center;
  justify-content: center;
}

@media (max-width: 992px) {
  .mobile-menu-toggle {
    display: flex;
  }
}

/* =========================================================================
   2. NEO-BRUTALIST BUTTONS
   ========================================================================= */
.neo-button, .btn-primary {
  background-color: var(--charcoal);
  color: var(--white);
  border: 2px solid var(--black);
  border-radius: 10px;
  padding: 14px 26px;
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 14px;
  letter-spacing: -0.01em;
  box-shadow: 6px 6px 0px var(--black);
  transition: transform 0.16s ease, box-shadow 0.16s ease;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
}

.neo-button:hover, .btn-primary:hover {
  transform: translate(3px, 3px);
  box-shadow: 3px 3px 0px var(--black);
}

.neo-button:active, .btn-primary:active {
  transform: translate(6px, 6px);
  box-shadow: none;
}

.btn-secondary {
  background-color: var(--yellow);
  color: var(--black);
  border: 2px solid var(--black);
  border-radius: 10px;
  padding: 14px 26px;
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 14px;
  box-shadow: 6px 6px 0px var(--black);
  transition: transform 0.16s ease, box-shadow 0.16s ease;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
}

.btn-secondary:hover {
  transform: translate(3px, 3px);
  box-shadow: 3px 3px 0px var(--black);
}

.btn-secondary:active {
  transform: translate(6px, 6px);
  box-shadow: none;
}

.btn-white {
  background-color: var(--white);
  color: var(--black);
  border: 2px solid var(--black);
  border-radius: 10px;
  padding: 14px 24px;
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 14px;
  box-shadow: 4px 4px 0px var(--black);
  transition: transform 0.16s ease, box-shadow 0.16s ease;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
}

.btn-white:hover {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0px var(--black);
}

.btn-white:active {
  transform: translate(4px, 4px);
  box-shadow: none;
}

.btn-sage {
  background-color: var(--sage);
  color: var(--charcoal);
  border: 2px solid var(--black);
  border-radius: 10px;
  padding: 10px 18px;
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 13px;
  box-shadow: 4px 4px 0px var(--black);
  transition: transform 0.16s ease, box-shadow 0.16s ease;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-sage:hover {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0px var(--black);
}

.btn-sage:active {
  transform: translate(4px, 4px);
  box-shadow: none;
}

.btn-danger {
  background-color: #fee2e2;
  color: #991b1b;
  border: 2px solid var(--black);
  border-radius: 10px;
  padding: 8px 14px;
  font-weight: 700;
  font-size: 12px;
  box-shadow: 3px 3px 0px var(--black);
  cursor: pointer;
  transition: transform 0.16s ease;
}

.btn-danger:hover {
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0px var(--black);
}

/* =========================================================================
   3. NEO-BRUTALIST CARDS & PANELS
   ========================================================================= */
.neo-card {
  background-color: var(--white);
  border: 2px solid var(--black);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 4px 4px 0px 0px var(--black);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  position: relative;
}

.neo-card:hover {
  transform: translate(-2px, -2px);
  box-shadow: 6px 6px 0px 0px var(--black);
}

.neo-card-large {
  background-color: var(--white);
  border: 2px solid var(--black);
  border-radius: 20px;
  padding: 32px;
  box-shadow: 8px 8px 0px 0px var(--black);
}

.neo-card-asymmetric {
  border-radius: 2px 24px 2px 24px;
}

.neo-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background-color: var(--white);
  color: var(--black);
  border: 2px solid var(--black);
  border-radius: 8px;
  padding: 4px 12px;
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 11px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  box-shadow: 3px 3px 0px var(--black);
}

.neo-badge-sage {
  background-color: var(--sage);
}

.neo-badge-yellow {
  background-color: var(--yellow);
}

/* =========================================================================
   4. HERO SECTION (55% / 45% Neo-Brutalist Layout)
   ========================================================================= */
.hero-section {
  background-color: var(--yellow);
  background-image: radial-gradient(rgba(0, 0, 0, 0.12) 1.5px, transparent 1.5px);
  background-size: 32px 32px;
  border-bottom: 2px solid var(--black);
  padding: 72px 0 84px 0;
}

@media (max-width: 768px) {
  .hero-section {
    padding: 44px 0 56px 0;
  }
}

.hero-grid {
  display: grid;
  grid-template-columns: 55% 45%;
  gap: 40px;
  align-items: center;
}

@media (max-width: 1024px) {
  .hero-grid {
    grid-template-columns: 1fr;
    gap: 36px;
  }
}

.hero-left {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.hero-title {
  font-size: 72px;
  line-height: 1.02;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--black);
  text-transform: uppercase;
}

@media (max-width: 1200px) {
  .hero-title {
    font-size: 58px;
  }
}

@media (max-width: 768px) {
  .hero-title {
    font-size: 42px;
  }
}

.hero-title-stroke {
  -webkit-text-stroke: 2px var(--black);
  color: transparent;
  display: inline-block;
}

.hero-desc {
  font-size: 18px;
  font-weight: 500;
  color: var(--charcoal);
  max-width: 560px;
  line-height: 1.55;
}

@media (max-width: 768px) {
  .hero-desc {
    font-size: 16px;
  }
}

.hero-cta-group {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 8px;
}

/* Hero Right: 3D Learning Mockup */
.hero-mockup-window {
  background-color: var(--white);
  border: 2px solid var(--black);
  border-radius: 16px;
  box-shadow: 12px 12px 0px 0px var(--black);
  overflow: hidden;
}

.mockup-titlebar {
  background-color: var(--charcoal);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid var(--black);
}

.mockup-window-dots {
  display: flex;
  align-items: center;
  gap: 8px;
}

.window-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.4);
}

.mockup-title {
  color: var(--yellow);
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 12px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.mockup-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.mockup-canvas-area {
  width: 100%;
  height: 250px;
  background-color: var(--gray-light);
  border: 2px solid var(--black);
  border-radius: 12px;
  position: relative;
  overflow: hidden;
}

.mockup-stats-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.mockup-stat-chip {
  background-color: var(--sage);
  border: 2px solid var(--black);
  border-radius: 8px;
  padding: 8px 10px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
}

.mockup-stat-label {
  font-size: 10px;
  color: var(--charcoal);
  text-transform: uppercase;
  font-weight: 800;
}

.mockup-stat-val {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 800;
  color: var(--black);
}

/* =========================================================================
   5. QUICK LEARNING ACTIONS (3 Đại diện Hình Học)
   ========================================================================= */
.quick-learning-section {
  padding: 64px 0;
  background-color: var(--gray-light);
}

.section-kicker {
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--charcoal);
  margin-bottom: 6px;
}

.section-heading {
  font-size: 36px;
  font-weight: 800;
  color: var(--black);
  margin-bottom: 32px;
  letter-spacing: -0.03em;
}

@media (max-width: 768px) {
  .section-heading {
    font-size: 28px;
  }
}

.three-shapes-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

@media (max-width: 992px) {
  .three-shapes-grid {
    grid-template-columns: 1fr;
  }
}

.shape-action-card {
  background-color: var(--white);
  border: 2px solid var(--black);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 4px 4px 0px 0px var(--black);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.shape-action-card:hover {
  transform: translate(-3px, -3px);
  box-shadow: 7px 7px 0px 0px var(--black);
}

.shape-icon-box {
  width: 64px;
  height: 64px;
  background-color: var(--sage);
  border: 2px solid var(--black);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  margin-bottom: 16px;
  box-shadow: 3px 3px 0px var(--black);
}

.shape-action-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--black);
  margin-bottom: 8px;
}

.shape-action-desc {
  font-size: 14px;
  color: var(--charcoal);
  line-height: 1.5;
  margin-bottom: 16px;
}

/* =========================================================================
   6. 3D LAB (Phòng Thí Nghiệm Không Gian Tối)
   ========================================================================= */
.lab-section {
  background-color: var(--charcoal);
  color: var(--white);
  padding: 72px 0;
  border-top: 2px solid var(--black);
  border-bottom: 2px solid var(--black);
}

.lab-heading {
  color: var(--yellow);
  font-size: 36px;
  font-weight: 800;
  margin-bottom: 8px;
}

.lab-subheading {
  color: var(--sage);
  font-size: 16px;
  margin-bottom: 32px;
}

.lab-grid {
  display: grid;
  grid-template-columns: 70% 30%;
  gap: 24px;
}

@media (max-width: 1024px) {
  .lab-grid {
    grid-template-columns: 1fr;
  }
}

.lab-viewport-box {
  background-color: var(--white);
  border: 2px solid var(--black);
  border-radius: 16px;
  box-shadow: 8px 8px 0px 0px var(--black);
  position: relative;
  overflow: hidden;
  height: 480px;
}

@media (max-width: 768px) {
  .lab-viewport-box {
    height: 340px;
  }
}

#three-canvas-main {
  width: 100%;
  height: 100%;
  display: block;
}

.lab-overlay-tag {
  position: absolute;
  top: 14px;
  left: 14px;
  background-color: var(--charcoal);
  color: var(--yellow);
  border: 2px solid var(--black);
  border-radius: 8px;
  padding: 6px 12px;
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 11px;
  letter-spacing: 0.05em;
  box-shadow: 3px 3px 0px var(--black);
}

.lab-overlay-controls {
  position: absolute;
  top: 14px;
  right: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.lab-tool-btn {
  width: 40px;
  height: 40px;
  background-color: var(--white);
  border: 2px solid var(--black);
  border-radius: 8px;
  box-shadow: 3px 3px 0px var(--black);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 16px;
  transition: transform 0.15s ease;
}

.lab-tool-btn:hover {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0px var(--black);
}

/* Control Panel (30%) */
.lab-control-panel {
  background-color: var(--sage);
  color: var(--charcoal);
  border: 2px solid var(--black);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 8px 8px 0px 0px var(--black);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 20px;
}

.control-group-title {
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 16px;
  color: var(--charcoal);
  text-transform: uppercase;
  margin-bottom: 12px;
  border-bottom: 2px solid var(--black);
  padding-bottom: 6px;
}

.neo-slider-row {
  margin-bottom: 16px;
}

.neo-slider-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 700;
  color: var(--charcoal);
  margin-bottom: 6px;
}

.neo-range-input {
  width: 100%;
  height: 10px;
  border-radius: 5px;
  background-color: var(--white);
  border: 2px solid var(--black);
  outline: none;
  cursor: pointer;
  accent-color: var(--charcoal);
}

.live-calc-box {
  background-color: var(--white);
  border: 2px solid var(--black);
  border-radius: 12px;
  padding: 14px;
  box-shadow: 4px 4px 0px var(--black);
}

.live-calc-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--gray-light);
}

.live-calc-row:last-child {
  border-bottom: none;
}

.live-calc-val {
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--black);
}

/* =========================================================================
   7. FORMULA SECTION
   ========================================================================= */
.formula-section {
  padding: 64px 0;
  background-color: var(--white);
  border-bottom: 2px solid var(--black);
}

.formula-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

@media (max-width: 992px) {
  .formula-grid {
    grid-template-columns: 1fr;
  }
}

.formula-card {
  background-color: var(--white);
  border: 2px solid var(--black);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 4px 4px 0px 0px var(--black);
}

.formula-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
